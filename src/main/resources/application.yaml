spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: flowpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowpay}
    username: ${DB_USERNAME:flowpay}
    password: ${DB_PASSWORD:flowpay_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: flowpay
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

flowpay:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:flowpay}
    audience: ${JWT_AUDIENCE:flowpay-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
